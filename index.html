<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Práctica 8 - Notificaciones</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="barra-superior">
        <div class="marca">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Mi sistema web</span>
        </div>

        <div class="zona-notificaciones">
            <button
                id="botonNotificaciones"
                class="boton-notificaciones"
                type="button"
                aria-label="Mostrar notificaciones"
                aria-expanded="false"
            >
                <i class="bi bi-bell-fill"></i>
                <span id="contador" class="contador" hidden>0</span>
            </button>

            <div id="listaNotificaciones"
                 class="lista-notificaciones"
                 hidden>
                <h2>Notificaciones</h2>
                <ul id="notificaciones"></ul>
                <p id="sinNotificaciones">No hay notificaciones todavía.</p>
            </div>
        </div>
    </header>

    <main class="contenido">
        <section class="tarjeta">
            <div class="icono-inicio">
                <i class="bi bi-house-door-fill"></i>
            </div>

            <h1>Bienvenido</h1>

            <p>
                Presiona el botón Inicio y escribe en el teclado.
                Por cada tres teclas presionadas se generará una
                nueva notificación.
            </p>

            <button id="botonInicio" class="boton-inicio" type="button">
                Inicio
            </button>

            <p id="estado" class="estado">
                Presiona Inicio para comenzar.
            </p>
        </section>
    </main>

</body>
</html>
